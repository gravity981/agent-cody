<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#164b72">Test controls do not replace saved preferences</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="55" y="90" width="215" height="145" rx="12" fill="#e8f0f5" stroke="#164b72" stroke-width="3"/>
    <text x="162" y="135" font-size="19" fill="#202a35">Enter test mode</text>
    <text x="162" y="171" font-size="15" fill="#53616d">RGB + temporary</text>
    <text x="162" y="195" font-size="15" fill="#53616d">brightness / volume</text>
    <path d="M280 162h150m-15-12 15 12-15 12" fill="none" stroke="#53616d" stroke-width="4"/>
    <rect x="445" y="90" width="210" height="145" rx="12" fill="#f3f5f7" stroke="#8795a1" stroke-width="3"/>
    <text x="550" y="135" font-size="19" fill="#202a35">Save tuning</text>
    <text x="550" y="171" font-size="15" fill="#53616d">explicit NVS write</text>
    <text x="550" y="195" font-size="15" fill="#53616d">with timestamp</text>
    <path d="M665 162h150m-15-12 15 12-15 12" fill="none" stroke="#53616d" stroke-width="4"/>
    <rect x="830" y="90" width="55" height="145" rx="12" fill="#dcefe1" stroke="#315b38" stroke-width="3"/>
    <text x="857" y="150" font-size="16" fill="#202a35">Exit</text>
    <text x="857" y="179" font-size="13" fill="#53616d">restore</text>
    <text x="857" y="201" font-size="13" fill="#53616d">prefs</text>
  </g>
  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#53616d">Volume and normal LED brightness are bridge preferences; motor tuning belongs to the device.</text>
</svg>
