    <text x="112" y="190" font-size="16" fill="#202a35">controller</text>
    <text x="112" y="225" font-size="14" fill="#53616d">USB-C</text>

    <rect x="210" y="85" width="155" height="180" rx="12" fill="#e8f0f5" stroke="#164b72" stroke-width="3"/>
    <text x="287" y="155" font-size="20" fill="#202a35">DRV8833</text>
    <text x="287" y="190" font-size="16" fill="#202a35">motor driver</text>

