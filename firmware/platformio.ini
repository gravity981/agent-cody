; Cody firmware (spec/architecture.md TD-01, TD-02).
; The platform is pinned; its packages are baked into the devcontainer image
; (.devcontainer/Dockerfile runs `pio pkg install` on this file).

[platformio]
default_envs = esp32c3

[env:esp32c3]
; ESP32-C3 SuperMini, compatible with the ESP32-C3-DevKitM-1 definition
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:native]
; Host unit tests (Unity) for the logic that has no Arduino calls
platform = platformio/native@1.2.1
test_framework = unity
