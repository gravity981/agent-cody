[project]
name = "cody-tools"
version = "0.0.0"
description = "Cody tools: requirement report and hardware test panel"
requires-python = ">=3.14,<3.15"
dependencies = ["pyserial==3.5"]

[project.scripts]
cody-report = "cody_tools.report:main"
cody-test-panel = "cody_tools.test_panel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
