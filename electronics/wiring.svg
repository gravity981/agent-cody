 y="-14.600000000000005" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="228.60000000000002" dy="11">5V</tspan></text><text x="228.60000000000002" y="14.2" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="228.60000000000002" dy="11">GND</tspan></text><text x="228.60000000000002" y="194.2" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="228.60000000000002" dy="11">GND</tspan></text><text x="-93.60000000000001" y="260.0" dominant-baseline="hanging" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-93.60000000000001" dy="10">Pins with the same net name are connected. 5V comes from USB through the SuperMini's 5V pin.</tspan><tspan x="-93.60000000000001" dy="10">DRV8833 board labels vary: IN1/IN2 = AIN1/AIN2, OUT1/OUT2 = AOUT1/AOUT2, VCC = VM, EEP or SLP = nSLEEP.</tspan><tspan x="-93.60000000000001" dy="10">Coil buzzer instead of a piezo: S and - to BOUT1/BOUT2, GPIO6 to BIN1, GPIO7 to BIN2 (architecture.md 4.3).</tspan></text></svg>