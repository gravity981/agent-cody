/text><text x="214.20000000000002" y="-151.4" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="214.20000000000002" dy="11">GND</tspan></text><text x="228.60000000000002" y="-14.600000000000005" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="228.60000000000002" dy="11">5V</tspan></text><text x="228.60000000000002" y="14.2" dominant-baseline="hanging" fill="#1f5fa8" font-size="11" font-family="sans" text-anchor="end"><tspan x="228.60000000000002" dy="11">GND</tspan></text><text x="-93.60000000000001" y="260.0" dominant-baseline="hanging" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-93.60000000000001" dy="10">Pins with the same net name are connected. 5V comes from USB through the SuperMini's 5V pin.</tspan><tspan x="-93.60000000000001" dy="10">DRV8833 board labels vary: AO1/AO2 = AOUT1/AOUT2, BO1/BO2 = BOUT1/BOUT2, STBY/SLP = nSLEEP, VCC = VM.</tspan><tspan x="-93.60000000000001" dy="10">KY-006 coil buzzer: GPIO6/7 to BIN1/BIN2; S and - to BOUT1/BOUT2.</tspan></text></svg>